<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Especialidades — EncontraMed Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="logo-text"><span class="logo-encontra">Encontra</span><span class="logo-med">Med</span></div><div class="logo-tagline">Admin Panel</div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a href="medicos.html" class="nav-item"><span class="nav-icon">👨‍⚕️</span><span class="nav-label">Médicos</span></a>
      <a href="hospitais.html" class="nav-item"><span class="nav-icon">🏥</span><span class="nav-label">Hospitais</span></a>
      <a href="plantoes.html" class="nav-item"><span class="nav-icon">📅</span><span class="nav-label">Plantões</span></a>
      <a href="escalas.html" class="nav-item"><span class="nav-icon">🗓</span><span class="nav-label">Escalas</span></a>
      <a href="especialidades.html" class="nav-item active"><span class="nav-icon">🩺</span><span class="nav-label">Especialidades</span></a>
      <a href="documentos.html" class="nav-item"><span class="nav-icon">📄</span><span class="nav-label">Documentos</span></a>
      <a href="financeiro.html" class="nav-item"><span class="nav-icon">💰</span><span class="nav-label">Financeiro</span></a>
      <a href="chamados.html" class="nav-item"><span class="nav-icon">🎧</span><span class="nav-label">Chamados</span></a>
      <a href="config.html" class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-label">Configurações</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="avatar" id="user-avatar">A</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-nome">Admin</div><div id="user-role" class="sidebar-user-role"></div></div></div>
      <button class="btn btn-ghost btn-sm" id="logout-btn">⬅ Sair</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left"><button class="sidebar-toggle" id="sidebar-toggle">☰</button><h1 class="page-title">Especialidades Médicas</h1></div>
      <div class="topbar-right"><button class="btn btn-primary btn-sm" onclick="abrirModal()">+ Nova Especialidade</button></div>
    </div>
    <div class="page-content">
      <div class="table-container">
        <div class="table-toolbar">
          <div class="table-toolbar-left">
            <input type="text" id="busca" class="input-field" placeholder="Buscar por nome ou código..." style="width:280px;" oninput="filtrar()">
          </div>
          <div class="table-toolbar-right">
            <span id="total-label" class="text-secondary" style="font-size:13px;"></span>
          </div>
        </div>
        <div class="table-scroll-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Código</th>
                <th>Descrição</th>
                <th>Plantões</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="esp-tbody">
              <tr><td colspan="6"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:none;align-items:center;justify-content:center;">
  <div class="card" style="width:480px;max-width:95vw;">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
      <h3 class="card-title" id="modal-titulo">Nova Especialidade</h3>
      <button class="btn btn-ghost btn-icon btn-sm" onclick="fecharModal()">✕</button>
    </div>
    <div class="card-body">
      <input type="hidden" id="edit-id">
      <div class="form-group">
        <label class="form-label">Nome <span style="color:var(--danger)">*</span></label>
        <input type="text" id="edit-nome" class="input-field" placeholder="Ex: Clínica Geral">
      </div>
      <div class="form-group">
        <label class="form-label">Código <span style="color:var(--danger)">*</span></label>
        <input type="text" id="edit-codigo" class="input-field" placeholder="Ex: CG ou CG01" maxlength="20">
        <div class="form-hint">Código único — geralmente sigla da especialidade</div>
      </div>
      <div class="form-group">
        <label class="form-label">Descrição</label>
        <input type="text" id="edit-descricao" class="input-field" placeholder="Opcional — breve descrição">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button class="btn btn-ghost btn-sm" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary btn-sm" id="btn-salvar" onclick="salvar()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script>
'use strict';

let _todas = [];

document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
  document.getElementById('main-content')?.classList.toggle('sidebar-collapsed');
});

async function carregar() {
  try {
    const data = await api.get('/especialidades');
    _todas = Array.isArray(data) ? data : [];
    renderizar(_todas);
  } catch (err) {
    document.getElementById('esp-tbody').innerHTML =
      `<tr><td colspan="6" style="text-align:center;color:var(--text-secondary);padding:32px;">Erro ao carregar especialidades.</td></tr>`;
    toast.error('Erro ao carregar especialidades');
  }
}

function renderizar(lista) {
  document.getElementById('total-label').textContent = `${lista.length} especialidade(s)`;
  if (!lista.length) {
    document.getElementById('esp-tbody').innerHTML =
      `<tr><td colspan="6"><div class="empty-state"><div class="empty-state-icon">🩺</div><div class="empty-state-title">Nenhuma especialidade</div><div class="empty-state-text">Clique em "+ Nova Especialidade" para adicionar.</div></div></td></tr>`;
    return;
  }
  document.getElementById('esp-tbody').innerHTML = lista.map(e => `
    <tr>
      <td class="td-secondary">#${e.id}</td>
      <td><strong>${e.nome}</strong></td>
      <td><span class="badge badge-info">${e.codigo}</span></td>
      <td class="td-secondary">${e.descricao || '—'}</td>
      <td class="td-secondary">${e._count?.plantoes ?? '—'}</td>
      <td>
        <div class="td-actions">
          <button class="btn btn-ghost btn-xs" onclick='editar(${JSON.stringify(e)})'>✏️ Editar</button>
          <button class="btn btn-danger btn-xs" onclick="remover(${e.id}, '${e.nome.replace(/'/g,"\\'") }')">🗑 Remover</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function filtrar() {
  const q = document.getElementById('busca').value.toLowerCase();
  renderizar(q ? _todas.filter(e => e.nome.toLowerCase().includes(q) || e.codigo.toLowerCase().includes(q)) : _todas);
}

function abrirModal(e = null) {
  document.getElementById('edit-id').value = e?.id || '';
  document.getElementById('edit-nome').value = e?.nome || '';
  document.getElementById('edit-codigo').value = e?.codigo || '';
  document.getElementById('edit-descricao').value = e?.descricao || '';
  document.getElementById('modal-titulo').textContent = e ? 'Editar Especialidade' : 'Nova Especialidade';
  document.getElementById('modal-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('edit-nome').focus(), 50);
}

function editar(e) { abrirModal(e); }

function fecharModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

async function salvar() {
  const id = document.getElementById('edit-id').value;
  const nome = document.getElementById('edit-nome').value.trim();
  const codigo = document.getElementById('edit-codigo').value.trim().toUpperCase();
  const descricao = document.getElementById('edit-descricao').value.trim();

  if (!nome || !codigo) { toast.error('Nome e código são obrigatórios'); return; }

  const btn = document.getElementById('btn-salvar');
  btn.disabled = true; btn.textContent = 'Salvando...';

  try {
    if (id) {
      await api.put(`/especialidades/${id}`, { nome, codigo, descricao: descricao || undefined });
      toast.success('Especialidade atualizada!');
    } else {
      await api.post('/especialidades', { nome, codigo, descricao: descricao || undefined });
      toast.success('Especialidade criada!');
    }
    fecharModal();
    await carregar();
  } catch (err) {
    toast.error(err.message || 'Erro ao salvar');
  } finally {
    btn.disabled = false; btn.textContent = 'Salvar';
  }
}

async function remover(id, nome) {
  const ok = await showConfirm(`Remover a especialidade "${nome}"? Esta ação não pode ser desfeita.`);
  if (!ok) return;
  try {
    await api.delete(`/especialidades/${id}`);
    toast.success('Especialidade removida');
    await carregar();
  } catch (err) {
    toast.error(err.message || 'Erro ao remover');
  }
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) fecharModal();
});

carregar();
</script>
</body>
</html>
