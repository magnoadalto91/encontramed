<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamados — EncontraMed Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="logo-text"><span class="logo-encontra">Encontra</span><span class="logo-med">Med</span></div><div class="logo-tagline">Admin Panel</div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a href="medicos.html" class="nav-item"><span class="nav-icon">👨‍⚕️</span><span class="nav-label">Médicos</span></a>
      <a href="hospitais.html" class="nav-item"><span class="nav-icon">🏥</span><span class="nav-label">Hospitais</span></a>
      <a href="plantoes.html" class="nav-item"><span class="nav-icon">📅</span><span class="nav-label">Plantões</span></a>
      <a href="escalas.html" class="nav-item"><span class="nav-icon">🗓</span><span class="nav-label">Escalas</span></a>
      <a href="documentos.html" class="nav-item"><span class="nav-icon">📄</span><span class="nav-label">Documentos</span></a>
      <a href="financeiro.html" class="nav-item"><span class="nav-icon">💰</span><span class="nav-label">Financeiro</span></a>
      <a href="chamados.html" class="nav-item active"><span class="nav-icon">🎧</span><span class="nav-label">Chamados</span></a>
      <a href="config.html" class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-label">Configurações</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="avatar" id="user-avatar">A</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-nome">Admin</div><div id="user-role" class="sidebar-user-role"></div></div></div>
      <button class="btn btn-ghost btn-sm" id="logout-btn">⬅ Sair</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left"><button class="sidebar-toggle" id="sidebar-toggle">☰</button><h1 class="page-title">Chamados de Suporte</h1></div>
      <div class="topbar-right">
        <select id="filter-status" class="select-field select-sm" onchange="loadChamados()">
          <option value="">Todos</option><option value="ABERTO">Abertos</option><option value="EM_ANDAMENTO">Em Andamento</option><option value="RESOLVIDO">Resolvidos</option>
        </select>
        <select id="filter-prioridade" class="select-field select-sm" onchange="loadChamados()">
          <option value="">Toda prioridade</option><option value="CRITICA">Crítica</option><option value="ALTA">Alta</option><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option>
        </select>
      </div>
    </div>
    <div class="page-content">
      <div class="card">
        <div class="card-body p-0">
          <div class="table-container">
            <table><thead><tr><th>#</th><th>Usuário</th><th>Título</th><th>Status</th><th>Prioridade</th><th>Criado</th><th>Responsável</th><th>Ações</th></tr></thead>
            <tbody id="chamados-tbody"><tr><td colspan="8" class="text-center text-muted">Carregando...</td></tr></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Thread Modal -->
<div id="thread-modal" style="display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; padding:24px;">
  <div style="background:var(--bg-card); border-radius:12px; width:100%; max-width:700px; max-height:80vh; display:flex; flex-direction:column; border:1px solid var(--border-color);">
    <div style="padding:20px 24px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
      <h3 id="thread-title" style="font-size:16px; font-weight:600; color:var(--text-primary)">Chamado</h3>
      <button onclick="closeThread()" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer">×</button>
    </div>
    <div id="thread-body" style="flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:12px;"></div>
    <div style="padding:16px 24px; border-top:1px solid var(--border-color);">
      <textarea id="reply-text" class="textarea-field" rows="3" placeholder="Digite sua resposta..." style="margin-bottom:12px"></textarea>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="closeThread()">Fechar</button>
        <button class="btn btn-ghost" onclick="responder(false)">Responder</button>
        <button class="btn btn-primary" onclick="responder(true)">✅ Resolver</button>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/toast.js"></script><script src="js/modal.js"></script>
<script>
document.getElementById('sidebar-toggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('collapsed'));

const PRIORIDADE_BADGE = { CRITICA:'badge-danger', ALTA:'badge-warning', NORMAL:'badge-primary', BAIXA:'badge-gray' };
const STATUS_BADGE = { ABERTO:'badge-success', EM_ANDAMENTO:'badge-primary', RESOLVIDO:'badge-gray' };
let currentPage = 1, activeChamadoId = null;

async function loadChamados(page = 1) {
  currentPage = page;
  const status = document.getElementById('filter-status').value;
  const prioridade = document.getElementById('filter-prioridade').value;
  const params = new URLSearchParams({ page, limit: 20, ...(status && {status}), ...(prioridade && {prioridade}) });

  const tbody = document.getElementById('chamados-tbody');
  try {
    const data = await api.get(`/admin/chamados?${params}`);
    const chamados = data.chamados || [];
    if (!chamados.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">🎧</div><div>Nenhum chamado encontrado</div></div></td></tr>';
      return;
    }
    tbody.innerHTML = chamados.map(c => `<tr>
      <td class="text-muted text-sm">#${c.id}</td>
      <td><div class="fw-500 text-sm">${c.usuario?.nomeCompleto || '—'}</div><div class="text-muted" style="font-size:11px">${c.usuario?.role || ''}</div></td>
      <td class="fw-500">${c.titulo}</td>
      <td><span class="badge ${STATUS_BADGE[c.status] || 'badge-gray'}">${c.status.replace('_',' ')}</span></td>
      <td><span class="badge ${PRIORIDADE_BADGE[c.prioridade] || 'badge-gray'}">${c.prioridade}</span></td>
      <td class="text-sm text-muted">${new Date(c.criadoEm).toLocaleDateString('pt-BR')}</td>
      <td class="text-sm">${c.suporte?.nomeCompleto || '<span class="text-muted">—</span>'}</td>
      <td><button class="btn btn-ghost btn-xs" onclick="openThread(${c.id}, '${c.titulo.replace(/'/g,"\\'")}')">💬 Abrir</button></td>
    </tr>`).join('');
    renderPagination(data.page, data.pages);
  } catch(err) { toast.error(err.message); }
}

async function openThread(id, titulo) {
  activeChamadoId = id;
  document.getElementById('thread-title').textContent = '#' + id + ' — ' + titulo;
  document.getElementById('thread-modal').style.display = 'flex';
  const body = document.getElementById('thread-body');
  body.innerHTML = '<div class="text-muted text-center">Carregando...</div>';

  try {
    const c = await api.get(`/admin/chamados/${id}`);
    body.innerHTML = `
      <div style="background:rgba(38,208,206,0.05); border-radius:8px; padding:16px; border:1px solid var(--border-color);">
        <div class="text-muted text-sm" style="margin-bottom:8px">Descrição</div>
        <div>${c.descricao}</div>
      </div>
      ${(c.mensagens||[]).map(m => `
        <div style="align-self:${m.autor?.role==='ADMIN'||m.autor?.role==='SUPORTE'?'flex-end':'flex-start'}; max-width:80%;">
          <div style="background:${m.autor?.role==='ADMIN'||m.autor?.role==='SUPORTE'?'rgba(38,208,206,0.15)':'var(--bg-secondary)'}; border-radius:8px; padding:12px 16px;">
            <div class="text-sm fw-500" style="margin-bottom:4px">${m.autor?.nomeCompleto||'—'}</div>
            <div>${m.texto}</div>
          </div>
          <div class="text-muted" style="font-size:11px; margin-top:4px">${new Date(m.criadoEm).toLocaleString('pt-BR')}</div>
        </div>
      `).join('')}
    `;
    body.scrollTop = body.scrollHeight;
  } catch(err) { toast.error(err.message); closeThread(); }
}

function closeThread() {
  document.getElementById('thread-modal').style.display = 'none';
  document.getElementById('reply-text').value = '';
  activeChamadoId = null;
  loadChamados(currentPage);
}

async function responder(resolver) {
  const texto = document.getElementById('reply-text').value.trim();
  if (!texto) return toast.warning('Digite uma mensagem antes de enviar');
  if (!activeChamadoId) return;
  try {
    await api.post(`/admin/chamados/${activeChamadoId}/mensagem`, { texto, resolver });
    toast.success(resolver ? 'Chamado resolvido!' : 'Resposta enviada!');
    if (resolver) closeThread(); else openThread(activeChamadoId, '');
  } catch(err) { toast.error(err.message); }
}

function renderPagination(page, pages) {
  const el = document.getElementById('pagination');
  if (!pages || pages <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = `<button class="btn btn-ghost btn-sm" ${page<=1?'disabled':''} onclick="loadChamados(${page-1})">← Anterior</button><span class="pagination-info">Página ${page} de ${pages}</span><button class="btn btn-ghost btn-sm" ${page>=pages?'disabled':''} onclick="loadChamados(${page+1})">Próxima →</button>`;
}

loadChamados();
</script>
</body></html>
