<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — EncontraMed Médico</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <a href="dashboard.html" class="sidebar-logo">
        <div class="logo-icon">E</div>
        <div class="logo-text">
          <span class="encontra">Encontra</span><span class="med">Med</span>
        </div>
      </a>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Início</span>
        </a>
        <a href="meus-plantoes.html" class="nav-item">
          <span class="nav-icon">📅</span>
          <span class="nav-label">Meus Plantões</span>
        </a>
        <a href="escalas.html" class="nav-item">
          <span class="nav-icon">🗓</span>
          <span class="nav-label">Escalas</span>
        </a>
        <a href="perfil.html" class="nav-item active">
          <span class="nav-icon">👤</span>
          <span class="nav-label">Perfil</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-menu">
          <div class="avatar" id="user-avatar">M</div>
          <div class="user-info">
            <div class="user-name" id="user-nome">Médico</div>
            <div class="user-role">Portal Médico</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout-btn" style="width:100%;margin-top:var(--space-2);">
          Sair
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <h1 class="topbar-title">Meu Perfil</h1>
        </div>
        <div class="topbar-right"></div>
      </header>

      <!-- Content -->
      <div class="content-area">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);margin-bottom:var(--space-6);" class="perfil-grid">

          <!-- Dados Pessoais -->
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Dados Pessoais</h2>
            </div>
            <form id="form-pessoal">
              <div style="display:flex;flex-direction:column;gap:var(--space-4);">
                <div class="form-group">
                  <label class="form-label" for="nome">Nome completo</label>
                  <input type="text" id="nome" class="input-field" placeholder="Seu nome completo">
                </div>
                <div class="form-group">
                  <label class="form-label" for="email">E-mail</label>
                  <input type="email" id="email" class="input-field" placeholder="seu@email.com" disabled>
                  <span class="form-hint">O e-mail não pode ser alterado aqui.</span>
                </div>
                <div class="form-group">
                  <label class="form-label" for="telefone">Telefone</label>
                  <input type="tel" id="telefone" class="input-field" placeholder="(11) 99999-9999">
                </div>
                <div style="display:flex;justify-content:flex-end;">
                  <button type="submit" class="btn btn-primary" id="btn-salvar-pessoal">Salvar Dados Pessoais</button>
                </div>
              </div>
            </form>
          </div>

          <!-- Dados Profissionais / CRM -->
          <div class="card">
            <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;">
              <h2 class="card-title">CRM &amp; Especialidades</h2>
              <span id="crm-status-badge"></span>
            </div>
            <div style="display:flex;flex-direction:column;gap:var(--space-4);">
              <div style="display:flex;gap:var(--space-3);">
                <div class="form-group" style="flex:2;margin:0;">
                  <label class="form-label" for="crm">Número do CRM</label>
                  <input type="text" id="crm" class="input-field" placeholder="123456" maxlength="7">
                </div>
                <div class="form-group" style="flex:1;margin:0;">
                  <label class="form-label" for="crm-uf">UF</label>
                  <input type="text" id="crm-uf" class="input-field" placeholder="SP" maxlength="2" style="text-transform:uppercase;">
                </div>
              </div>
              <button class="btn btn-primary btn-sm" id="btn-validar-crm" onclick="validarCrm()">
                🔍 Validar no CFM
              </button>

              <!-- CFM data panel — shown after validation -->
              <div id="cfm-panel" style="display:none; background:rgba(38,208,206,0.06); border:1px solid rgba(38,208,206,0.2); border-radius:10px; padding:16px; margin-top:4px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
                  <span style="font-size:16px;">🏥</span>
                  <strong style="color:var(--color-primary);font-size:14px;">Dados do CFM</strong>
                  <small id="cfm-ultima-verif" style="color:var(--color-text-muted);margin-left:auto;"></small>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;">
                  <div><span style="color:var(--color-text-muted);font-size:13px;">Nome no CFM:</span><br>
                    <strong id="cfm-nome" style="color:var(--color-text);font-size:14px;">—</strong></div>
                  <div><span style="color:var(--color-text-muted);font-size:13px;">Especialidades:</span><br>
                    <div id="cfm-especialidades" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Documentos -->
        <div class="table-container">
          <div class="table-toolbar">
            <div class="table-toolbar-left">
              <span class="card-title">📄 Documentos</span>
            </div>
            <div class="table-toolbar-right">
              <span id="docs-total" class="form-hint"></span>
            </div>
          </div>
          <div class="table-scroll-wrap">
            <table>
              <thead>
                <tr>
                  <th>Tipo</th>
                  <th>Status</th>
                  <th>Data de Envio</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="docs-tbody">
                <tr>
                  <td colspan="4">
                    <div class="loading-overlay">
                      <div class="spinner"></div>
                      <span class="loading-text">Carregando documentos...</span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script>
    'use strict';

    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('collapsed');
      document.getElementById('main-content').classList.toggle('sidebar-collapsed');
    });

    function fmtData(str) {
      if (!str) return '—';
      try { return new Date(str).toLocaleDateString('pt-BR'); }
      catch { return str; }
    }

    function docStatusBadge(status) {
      const map = {
        PENDENTE: 'badge-warning',
        APROVADO: 'badge-success',
        APROVADA: 'badge-success',
        REJEITADO: 'badge-danger',
        REJEITADA: 'badge-danger',
        VERIFICADO: 'badge-verificado',
        ENVIADO: 'badge-info',
      };
      const cls = map[status] || 'badge-nao-verificado';
      return `<span class="badge ${cls}">${status || 'PENDENTE'}</span>`;
    }

    const CRM_STATUS_BADGE = {
      ATIVO:          '<span class="badge badge-success">✓ Ativo</span>',
      INATIVO:        '<span class="badge badge-secondary">Inativo</span>',
      SUSPENSO:       '<span class="badge badge-warning">Suspenso</span>',
      CANCELADO:      '<span class="badge badge-danger">Cancelado</span>',
      NAO_VERIFICADO: '<span class="badge badge-secondary">Não verificado</span>',
    };

    function renderCfmPanel(dados, ultimaVerif) {
      const panel = document.getElementById('cfm-panel');
      if (!dados) { panel.style.display = 'none'; return; }
      panel.style.display = 'block';
      document.getElementById('cfm-nome').textContent = dados.nome || '—';
      if (ultimaVerif) {
        document.getElementById('cfm-ultima-verif').textContent = 'Verificado em ' + new Date(ultimaVerif).toLocaleDateString('pt-BR');
      }
      const esps = dados.especialidades || [];
      document.getElementById('cfm-especialidades').innerHTML = esps.length
        ? esps.map(e => `<span class="badge badge-info" style="font-size:12px;">${e.nome}${e.rqe ? ' <small>RQE '+e.rqe+'</small>' : ''}</span>`).join('')
        : '<span style="color:var(--color-text-muted);font-size:13px;">Nenhuma especialidade registrada</span>';
    }

    async function validarCrm() {
      const crm = document.getElementById('crm').value.replace(/\D/g,'');
      const uf = document.getElementById('crm-uf').value.toUpperCase().trim();
      if (!crm || !uf) { toast.warning('Informe o CRM e a UF'); return; }

      const btn = document.getElementById('btn-validar-crm');
      btn.disabled = true; btn.textContent = '⏳ Consultando CFM...';

      try {
        const dados = await api.post('/crm/vincular', { crm, uf });
        document.getElementById('crm-status-badge').innerHTML = CRM_STATUS_BADGE[dados.situacao] || CRM_STATUS_BADGE.NAO_VERIFICADO;
        renderCfmPanel(dados, new Date().toISOString());
        toast.success('CRM validado com sucesso!');
      } catch (err) {
        toast.error(err.message || 'Erro ao validar CRM');
      } finally {
        btn.disabled = false; btn.textContent = '🔍 Validar no CFM';
      }
    }

    async function loadPerfil() {
      try {
        const data = await api.get('/medicos/me');
        const medico = data.medico || data;

        document.getElementById('nome').value = medico.nomeCompleto || medico.nome || '';
        document.getElementById('email').value = medico.email || '';
        document.getElementById('telefone').value = medico.telefone || '';
        document.getElementById('crm').value = medico.crm || '';
        document.getElementById('crm-uf').value = medico.crmUf || medico.uf || '';

        // Show CRM status badge
        const status = medico.crmStatus || 'NAO_VERIFICADO';
        document.getElementById('crm-status-badge').innerHTML = CRM_STATUS_BADGE[status] || CRM_STATUS_BADGE.NAO_VERIFICADO;

        // Show CFM data if already validated
        if (medico.crmDadosCfm) {
          renderCfmPanel(medico.crmDadosCfm, medico.crmUltimaVerif);
        }
      } catch (err) {
        toast.error('Erro ao carregar perfil: ' + err.message);
      }
    }

    window.validarCrm = validarCrm;

    async function loadDocumentos() {
      const tbody = document.getElementById('docs-tbody');
      try {
        const data = await api.get('/documentos/meus');
        const list = Array.isArray(data) ? data : (data.documentos || data.data || []);

        document.getElementById('docs-total').textContent = `${list.length} documento${list.length !== 1 ? 's' : ''}`;

        if (!list.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4">
                <div class="empty-state">
                  <div class="empty-state-icon">📄</div>
                  <div class="empty-state-title">Nenhum documento</div>
                  <div class="empty-state-text">Você não enviou nenhum documento ainda.</div>
                </div>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = list.map(doc => {
          const isAprovado = ['APROVADO', 'APROVADA', 'VERIFICADO'].includes(doc.status);
          return `
            <tr>
              <td>${doc.tipo || doc.tipoDocumento || '—'}</td>
              <td>${docStatusBadge(doc.status)}</td>
              <td class="td-secondary">${fmtData(doc.createdAt || doc.dataEnvio)}</td>
              <td>
                <div class="td-actions">
                  ${doc.url || doc.arquivo ? `<a href="${doc.url || doc.arquivo}" target="_blank" class="btn btn-ghost btn-sm">Ver</a>` : ''}
                  ${!isAprovado ? `<button class="btn btn-primary btn-sm" onclick="enviarDocumento(${doc.id}, '${doc.tipo}')">Enviar</button>` : ''}
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4">
              <div class="empty-state">
                <div class="empty-state-icon">⚠️</div>
                <div class="empty-state-title">Erro ao carregar documentos</div>
                <div class="empty-state-text">${err.message}</div>
              </div>
            </td>
          </tr>
        `;
      }
    }

    function enviarDocumento(id, tipo) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*,.pdf';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('arquivo', file);
        formData.append('tipo', tipo);
        try {
          await api.upload(`/documentos/${id}`, formData);
          toast.success('Documento enviado com sucesso!');
          loadDocumentos();
        } catch (err) {
          toast.error(err.message || 'Erro ao enviar documento.');
        }
      };
      input.click();
    }

    document.getElementById('form-pessoal').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-salvar-pessoal');
      btn.classList.add('btn-loading');
      btn.disabled = true;

      try {
        await api.put('/medicos/me', {
          nomeCompleto: document.getElementById('nome').value.trim(),
          telefone: document.getElementById('telefone').value.trim(),
        });
        toast.success('Dados pessoais salvos com sucesso!');

        // Update cached user
        const user = JSON.parse(localStorage.getItem('medico_user') || '{}');
        user.nomeCompleto = document.getElementById('nome').value.trim();
        localStorage.setItem('medico_user', JSON.stringify(user));
        document.getElementById('user-nome').textContent = user.nomeCompleto || 'Médico';
        const avatar = document.getElementById('user-avatar');
        if (avatar && user.nomeCompleto) {
          avatar.textContent = user.nomeCompleto.split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
        }
      } catch (err) {
        toast.error(err.message || 'Erro ao salvar dados.');
      } finally {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
    });

    // Responsive: collapse grid on small screens
    function adjustGrid() {
      const grid = document.querySelector('.perfil-grid');
      if (!grid) return;
      if (window.innerWidth < 900) {
        grid.style.gridTemplateColumns = '1fr';
      } else {
        grid.style.gridTemplateColumns = '1fr 1fr';
      }
    }
    window.addEventListener('resize', adjustGrid);
    adjustGrid();

    window.enviarDocumento = enviarDocumento;

    loadPerfil();
    loadDocumentos();
  </script>
</body>
</html>
