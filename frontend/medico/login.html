<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EncontraMed — Portal Médico</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-primary);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(38, 208, 206, 0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(26, 110, 189, 0.07) 0%, transparent 60%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: var(--space-8);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
    }
    .login-logo {
      text-align: center;
      margin-bottom: var(--space-8);
    }
    .login-logo .logo-icon {
      width: 56px;
      height: 56px;
      background: var(--gradient);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: white;
      margin: 0 auto var(--space-4);
      box-shadow: var(--shadow-glow);
    }
    .login-logo .logo-encontra {
      color: var(--accent-teal);
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
    }
    .login-logo .logo-med {
      color: rgba(255,255,255,0.9);
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
    }
    .login-subtitle {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin-top: var(--space-2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
    }
    .login-subtitle-badge {
      background: rgba(38, 208, 206, 0.12);
      color: var(--accent-teal);
      border: 1px solid rgba(38, 208, 206, 0.25);
      border-radius: var(--radius-full);
      padding: 2px 10px;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .login-footer-text {
      text-align: center;
      margin-top: var(--space-5);
      font-size: var(--font-size-sm);
      color: var(--text-muted);
    }
    .btn-login {
      width: 100%;
      padding: var(--space-4);
      font-size: var(--font-size-md);
      margin-top: var(--space-2);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">E</div>
      <div>
        <span class="logo-encontra">Encontra</span><span class="logo-med">Med</span>
      </div>
      <div class="login-subtitle">
        <span class="login-subtitle-badge">Portal Médico</span>
      </div>
    </div>

    <form class="login-form" id="login-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input
          type="email"
          id="email"
          class="input-field"
          placeholder="seu@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="senha"
            class="input-field"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
          <button type="button" class="input-action" id="toggle-senha" aria-label="Mostrar senha" title="Mostrar/ocultar senha">
            👁
          </button>
        </div>
      </div>

      <div id="login-error" style="display:none;" class="form-error" role="alert"></div>

      <button type="submit" class="btn btn-primary btn-login" id="btn-submit">
        Entrar
      </button>
    </form>

    <p class="login-footer-text">Não tem conta? Cadastre-se no app</p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script>
    'use strict';

    // If already logged in, redirect
    if (localStorage.getItem('medico_token')) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
    const toggleSenha = document.getElementById('toggle-senha');
    const btnSubmit = document.getElementById('btn-submit');
    const errorEl = document.getElementById('login-error');

    toggleSenha.addEventListener('click', () => {
      const isPassword = senhaInput.type === 'password';
      senhaInput.type = isPassword ? 'text' : 'password';
      toggleSenha.textContent = isPassword ? '🙈' : '👁';
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function hideError() {
      errorEl.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = emailInput.value.trim();
      const senha = senhaInput.value;

      if (!email || !senha) {
        showError('Preencha e-mail e senha.');
        return;
      }

      btnSubmit.classList.add('btn-loading');
      btnSubmit.disabled = true;

      try {
        const data = await api.post('/auth/login', { email, senha, plataforma: 'web' });

        if (data.user?.role !== 'MEDICO') {
          showError('Esta área é exclusiva para médicos.');
          return;
        }

        localStorage.setItem('medico_token', data.token);
        localStorage.setItem('medico_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message || 'Erro ao entrar. Verifique suas credenciais.');
      } finally {
        btnSubmit.classList.remove('btn-loading');
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
