<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escalas — EncontraMed Médico</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <a href="dashboard.html" class="sidebar-logo">
        <div class="logo-icon">E</div>
        <div class="logo-text">
          <span class="encontra">Encontra</span><span class="med">Med</span>
        </div>
      </a>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Início</span>
        </a>
        <a href="meus-plantoes.html" class="nav-item">
          <span class="nav-icon">📅</span>
          <span class="nav-label">Meus Plantões</span>
        </a>
        <a href="escalas.html" class="nav-item active">
          <span class="nav-icon">🗓</span>
          <span class="nav-label">Escalas</span>
        </a>
        <a href="perfil.html" class="nav-item">
          <span class="nav-icon">👤</span>
          <span class="nav-label">Perfil</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-menu">
          <div class="avatar" id="user-avatar">M</div>
          <div class="user-info">
            <div class="user-name" id="user-nome">Médico</div>
            <div class="user-role">Portal Médico</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout-btn" style="width:100%;margin-top:var(--space-2);">
          Sair
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <h1 class="topbar-title">Minhas Escalas</h1>
        </div>
        <div class="topbar-right"></div>
      </header>

      <!-- Content -->
      <div class="content-area">
        <div class="table-container">
          <div class="table-toolbar">
            <div class="table-toolbar-left">
              <span class="card-title">Escalas Confirmadas</span>
            </div>
            <div class="table-toolbar-right">
              <span id="total-label" class="form-hint"></span>
            </div>
          </div>
          <div class="table-scroll-wrap">
            <table>
              <thead>
                <tr>
                  <th>Hospital</th>
                  <th>Especialidade</th>
                  <th>Data</th>
                  <th>Hora Início</th>
                  <th>Hora Fim</th>
                  <th>Tipo</th>
                </tr>
              </thead>
              <tbody id="escalas-tbody">
                <tr>
                  <td colspan="6">
                    <div class="loading-overlay">
                      <div class="spinner"></div>
                      <span class="loading-text">Carregando escalas...</span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script>
    'use strict';

    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('collapsed');
      document.getElementById('main-content').classList.toggle('sidebar-collapsed');
    });

    function fmtDate(str) {
      if (!str) return '—';
      try { return new Date(str).toLocaleDateString('pt-BR'); }
      catch { return str; }
    }

    function fmtTime(str) {
      if (!str) return '—';
      try {
        return new Date(str).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      } catch { return str; }
    }

    async function loadEscalas() {
      const tbody = document.getElementById('escalas-tbody');
      try {
        const data = await api.get('/escalas/minhas');
        const list = Array.isArray(data) ? data : (data.escalas || data.data || []);

        document.getElementById('total-label').textContent = `${list.length} escala${list.length !== 1 ? 's' : ''}`;

        if (!list.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6">
                <div class="empty-state">
                  <div class="empty-state-icon">🗓</div>
                  <div class="empty-state-title">Nenhuma escala confirmada</div>
                  <div class="empty-state-text">Você não possui escalas confirmadas no momento. Candidate-se a plantões para aparecer aqui.</div>
                </div>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = list.map(e => {
          const plantao = e.plantao || e;
          const hospital = plantao.hospital || {};
          return `
            <tr>
              <td>${hospital.nomeFantasia || hospital.razaoSocial || plantao.hospitalNome || e.hospitalNome || '—'}</td>
              <td>${plantao.especialidade || e.especialidade || '—'}</td>
              <td class="td-secondary">${fmtDate(plantao.dataHoraInicio || e.dataInicio || e.data)}</td>
              <td class="td-secondary">${fmtTime(plantao.dataHoraInicio || e.dataHoraInicio || e.horaInicio)}</td>
              <td class="td-secondary">${fmtTime(plantao.dataHoraFim || e.dataHoraFim || e.horaFim)}</td>
              <td>${plantao.tipo || e.tipo || '—'}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <div class="empty-state-icon">⚠️</div>
                <div class="empty-state-title">Erro ao carregar escalas</div>
                <div class="empty-state-text">${err.message}</div>
              </div>
            </td>
          </tr>
        `;
      }
    }

    loadEscalas();
  </script>
</body>
</html>
