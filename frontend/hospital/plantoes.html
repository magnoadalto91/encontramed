<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
  <title>Plantões — Portal Hospital | EncontraMed</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .tipo-valor-group { display:flex; gap:10px; margin-bottom:var(--space-4); }
    .tipo-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:10px; border:1px solid var(--border); border-radius:8px; cursor:pointer; background:transparent; color:var(--text-secondary); font-size:13px; font-weight:600; transition:all .15s; }
    .tipo-btn.active { background:rgba(38,208,206,.15); border-color:var(--accent); color:var(--accent); }
    .calc-preview { background:rgba(46,213,115,.08); border:1px solid rgba(46,213,115,.2); border-radius:8px; padding:10px 14px; margin-bottom:var(--space-4); color:#2ED573; font-size:13px; font-weight:600; display:none; }
    /* Chat modal */
    .chat-overlay { position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;display:none;align-items:center;justify-content:center; }
    .chat-modal { background:var(--bg-card);border:1px solid var(--border);border-radius:16px;width:520px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column; }
    .chat-header { display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border); }
    .chat-header-info h4 { color:var(--text-primary);font-size:15px;font-weight:700;margin:0; }
    .chat-header-info small { color:var(--text-secondary);font-size:12px; }
    .chat-messages { flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:280px; }
    .chat-bubble { max-width:72%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5; }
    .chat-bubble.mine { align-self:flex-end;background:var(--accent);color:#0A1628;border-bottom-right-radius:4px; }
    .chat-bubble.other { align-self:flex-start;background:#1A2E4A;color:var(--text-secondary);border-bottom-left-radius:4px; }
    .chat-bubble .author { font-size:11px;font-weight:700;margin-bottom:4px;color:var(--accent); }
    .chat-bubble.mine .author { color:#0A1628; }
    .chat-bubble .time { font-size:10px;opacity:.6;margin-top:4px;text-align:right; }
    .chat-input-row { display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--border); }
    .chat-input-row textarea { flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text-primary);font-size:14px;resize:none;height:44px;outline:none; }
    .chat-input-row textarea:focus { border-color:var(--accent); }
    .btn-send { background:var(--accent);color:#0A1628;border:none;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer;font-size:15px;height:44px; }
    .chat-empty { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-secondary);font-size:14px;padding:40px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a href="dashboard.html" class="sidebar-logo">
        <div class="logo-icon">🏥</div>
        <div class="logo-text">
          <span class="encontra">Encontra</span><span class="med">Med</span>
          <div style="font-size:var(--font-size-xs);font-weight:var(--font-weight-normal);color:var(--text-secondary);margin-top:2px;">Portal Hospital</div>
        </div>
      </a>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
        <a href="plantoes.html" class="nav-item active"><span class="nav-icon">📅</span><span class="nav-label">Plantões</span></a>
        <a href="escalas.html" class="nav-item"><span class="nav-icon">🗓</span><span class="nav-label">Escalas</span></a>
        <a href="candidaturas.html" class="nav-item"><span class="nav-icon">👥</span><span class="nav-label">Candidaturas</span></a>
        <a href="perfil.html" class="nav-item"><span class="nav-icon">🏥</span><span class="nav-label">Perfil</span></a>
      </nav>
      <div class="sidebar-footer">
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div class="avatar" id="user-avatar">H</div>
          <div style="flex:1;overflow:hidden;">
            <div class="user-name truncate" id="user-nome">Hospital</div>
            <div class="user-role">Hospital</div>
          </div>
          <button id="logout-btn" class="btn btn-ghost btn-icon btn-sm" title="Sair" style="flex-shrink:0;">⏻</button>
        </div>
      </div>
    </aside>

    <div class="main-content" id="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <span class="topbar-title">Plantões</span>
        </div>
        <div class="topbar-right">
          <select class="select-field" id="filter-status" style="width:auto;">
            <option value="">Todos os status</option>
            <option value="ABERTO">Aberto</option>
            <option value="CANDIDATADO">Candidatado</option>
            <option value="CONFIRMADO">Confirmado</option>
            <option value="REALIZADO">Realizado</option>
            <option value="CANCELADO">Cancelado</option>
          </select>
          <button class="btn btn-primary btn-sm" id="btn-novo-plantao">+ Novo Plantão</button>
        </div>
      </header>

      <div class="content-area">
        <div class="table-container">
          <div class="table-scroll-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Especialidade</th>
                  <th>Data / Horário</th>
                  <th>Duração</th>
                  <th>Valor</th>
                  <th>Status</th>
                  <th>Candidatos</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="plantoes-tbody">
                <tr><td colspan="8"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Novo Plantão -->
  <div class="modal-overlay" id="modal-plantao" style="display:none;">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">Novo Plantão</h3>
        <button class="modal-close-btn" onclick="fecharModalPlantao()">×</button>
      </div>
      <div class="modal-body">
        <form id="form-plantao" novalidate>

          <div class="form-grid">
            <!-- Título -->
            <div class="form-group form-col-full">
              <label class="form-label">Título *</label>
              <input type="text" class="input-field" id="p-titulo" placeholder="Ex: Plantão UTI — 12h noturno" required />
            </div>

            <!-- Especialidade -->
            <div class="form-group form-col-full">
              <label class="form-label">Especialidade *</label>
              <select class="select-field" id="p-especialidade" required>
                <option value="">Selecione a especialidade...</option>
              </select>
            </div>

            <!-- Data/Hora -->
            <div class="form-group">
              <label class="form-label">Data e Hora de Início *</label>
              <input type="datetime-local" class="input-field" id="p-data-inicio" required />
            </div>
            <div class="form-group">
              <label class="form-label">Data e Hora de Fim *</label>
              <input type="datetime-local" class="input-field" id="p-data-fim" required />
            </div>
            <div class="form-group form-col-full" id="duracao-preview" style="display:none;">
              <span style="color:var(--accent);font-size:13px;" id="duracao-text"></span>
            </div>

            <!-- Local -->
            <div class="form-group" style="max-width:180px;">
              <label class="form-label">CEP</label>
              <div style="position:relative;">
                <input type="text" class="input-field" id="p-local-cep" placeholder="00000-000" maxlength="9"
                  oninput="onCepInput(this.value)"
                  style="padding-right:36px;" />
                <span id="cep-spinner" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);display:none;color:var(--accent);font-size:14px;">⟳</span>
              </div>
            </div>
            <div class="form-group form-col-full">
              <label class="form-label">Local / Nome do Hospital *</label>
              <input type="text" class="input-field" id="p-local-nome" placeholder="Ex: UTI — Bloco C" required />
            </div>
            <div class="form-group">
              <label class="form-label">Cidade *</label>
              <input type="text" class="input-field" id="p-local-cidade" placeholder="São Paulo" required />
            </div>
            <div class="form-group" style="max-width:120px;">
              <label class="form-label">UF *</label>
              <input type="text" class="input-field" id="p-local-uf" placeholder="SP" maxlength="2" style="text-transform:uppercase;" required />
            </div>

            <!-- Tipo de Valor -->
            <div class="form-group form-col-full">
              <label class="form-label">Tipo de Remuneração *</label>
              <div class="tipo-valor-group">
                <button type="button" class="tipo-btn active" id="btn-tipo-fixo" onclick="setTipoValor('FIXO')">
                  ✓ Valor Fixo
                </button>
                <button type="button" class="tipo-btn" id="btn-tipo-hora" onclick="setTipoValor('POR_HORA')">
                  ⏱ Valor por Hora
                </button>
              </div>
              <input type="hidden" id="p-tipo-valor" value="FIXO" />
            </div>

            <div class="form-group">
              <label class="form-label" id="label-valor">Valor Total (R$) *</label>
              <input type="number" class="input-field" id="p-valor" min="0" step="0.01" placeholder="0,00" required oninput="calcularPreview()" />
            </div>
            <div class="form-group" style="display:flex;align-items:flex-end;padding-bottom:4px;">
              <div class="calc-preview" id="calc-preview" style="display:none;margin:0;width:100%;"></div>
            </div>

            <!-- Opções -->
            <div class="form-group">
              <label class="form-label" style="margin-bottom:8px;">Opções</label>
              <div style="display:flex;flex-direction:column;gap:8px;">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                  <input type="checkbox" id="p-rqe" />
                  <span style="color:var(--text-secondary);font-size:13px;">Exige RQE</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                  <input type="checkbox" id="p-bid" onchange="toggleBid()" />
                  <span style="color:var(--text-secondary);font-size:13px;">Aceitar propostas (bid)</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                  <input type="checkbox" id="p-urgente" />
                  <span style="color:var(--text-secondary);font-size:13px;">Urgente (notifica médicos próximos)</span>
                </label>
              </div>
            </div>

            <div class="form-group" id="grupo-bid" style="display:none;">
              <label class="form-label">Valor Mínimo de Proposta (R$)</label>
              <input type="number" class="input-field" id="p-valor-min-bid" min="0" step="0.01" placeholder="0,00" />
            </div>

            <div class="form-group form-col-full">
              <label class="form-label">Descrição / Observações</label>
              <textarea class="textarea-field" id="p-obs" placeholder="Informações adicionais sobre o plantão..."></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="fecharModalPlantao()">Cancelar</button>
        <button class="btn btn-primary" id="btn-salvar-plantao">Criar Plantão</button>
      </div>
    </div>
  </div>

  <!-- Modal Chat -->
  <div class="chat-overlay" id="chat-overlay">
    <div class="chat-modal">
      <div class="chat-header">
        <div class="chat-header-info">
          <h4 id="chat-titulo">Chat do Plantão</h4>
          <small id="chat-subtitulo"></small>
        </div>
        <button class="modal-close-btn" onclick="fecharChat()">×</button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-empty">
          <span style="font-size:32px;">💬</span>
          <span>Nenhuma mensagem ainda</span>
        </div>
      </div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="Digite uma mensagem..." maxlength="1000" onkeydown="if(event.ctrlKey&&event.key==='Enter')enviarMensagemChat()"></textarea>
        <button class="btn-send" onclick="enviarMensagemChat()">↑</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script>
  'use strict';

  // ─── CEP ────────────────────────────────────────────────────────────────────
  function maskCep(v) {
    const d = v.replace(/\D/g, '').slice(0, 8);
    return d.length > 5 ? d.slice(0,5) + '-' + d.slice(5) : d;
  }

  let _cepTimer;
  function onCepInput(raw) {
    const el = document.getElementById('p-local-cep');
    el.value = maskCep(raw);
    clearTimeout(_cepTimer);
    const digits = el.value.replace(/\D/g,'');
    if (digits.length === 8) {
      _cepTimer = setTimeout(() => buscarCep(digits), 400);
    }
  }
  window.onCepInput = onCepInput;

  async function buscarCep(digits) {
    const spinner = document.getElementById('cep-spinner');
    spinner.style.display = 'inline';
    try {
      const r = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
      const d = await r.json();
      if (d.erro) { toast.error('CEP não encontrado'); return; }
      const nomeEl = document.getElementById('p-local-nome');
      if (!nomeEl.value) nomeEl.value = d.logradouro || '';
      document.getElementById('p-local-cidade').value = d.localidade || '';
      document.getElementById('p-local-uf').value = (d.uf || '').toUpperCase();
    } catch {
      toast.error('Erro ao buscar CEP');
    } finally {
      spinner.style.display = 'none';
    }
  }

  let _chatPlantaoId = null;
  let _meUserId = null;

  // Tentar pegar userId do token
  try {
    const t = localStorage.getItem('hospital_token') || localStorage.getItem('token');
    if (t) { const p = JSON.parse(atob(t.split('.')[1])); _meUserId = p.userId; }
  } catch {}

  document.getElementById('sidebar-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
    document.getElementById('main-content').classList.toggle('sidebar-collapsed');
  });

  function statusBadge(s) {
    const map = { ABERTO:'badge-aberto', CONFIRMADO:'badge-confirmado', REALIZADO:'badge-realizado', CANCELADO:'badge-cancelado', CANDIDATADO:'badge-candidatado', EXPIRADO:'badge-expirado' };
    return `<span class="badge ${map[s]||'badge-info'}">${s}</span>`;
  }

  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function fmtMoney(v, tipo) {
    if (v == null) return '—';
    const s = Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
    return tipo === 'POR_HORA' ? s + '/h' : s;
  }

  function fmtDuracao(inicio, fim) {
    if (!inicio || !fim) return '—';
    const h = (new Date(fim) - new Date(inicio)) / 3600000;
    return h.toFixed(1) + 'h';
  }

  // ─── Tipo de valor ─────────────────────────────────────────────────────────
  function setTipoValor(tipo) {
    document.getElementById('p-tipo-valor').value = tipo;
    document.getElementById('btn-tipo-fixo').classList.toggle('active', tipo === 'FIXO');
    document.getElementById('btn-tipo-hora').classList.toggle('active', tipo === 'POR_HORA');
    document.getElementById('label-valor').textContent = tipo === 'FIXO' ? 'Valor Total (R$) *' : 'Valor por Hora (R$/h) *';
    calcularPreview();
  }

  function calcularPreview() {
    const tipo = document.getElementById('p-tipo-valor').value;
    const valor = parseFloat(document.getElementById('p-valor').value);
    const inicio = document.getElementById('p-data-inicio').value;
    const fim = document.getElementById('p-data-fim').value;
    const preview = document.getElementById('calc-preview');

    if (tipo === 'POR_HORA' && valor > 0 && inicio && fim) {
      const horas = (new Date(fim) - new Date(inicio)) / 3600000;
      if (horas > 0) {
        preview.style.display = 'block';
        preview.textContent = `⟹ Total estimado: ${(valor * horas).toLocaleString('pt-BR', { style:'currency', currency:'BRL' })} (${horas.toFixed(1)}h)`;
        return;
      }
    }
    preview.style.display = 'none';
  }

  function atualizarDuracao() {
    const inicio = document.getElementById('p-data-inicio').value;
    const fim = document.getElementById('p-data-fim').value;
    const preview = document.getElementById('duracao-preview');
    if (inicio && fim) {
      const h = (new Date(fim) - new Date(inicio)) / 3600000;
      if (h > 0) {
        document.getElementById('duracao-text').textContent = `⏱ Duração: ${h.toFixed(1)}h`;
        preview.style.display = 'block';
        calcularPreview();
        return;
      }
    }
    preview.style.display = 'none';
  }

  document.getElementById('p-data-inicio').addEventListener('change', atualizarDuracao);
  document.getElementById('p-data-fim').addEventListener('change', atualizarDuracao);

  function toggleBid() {
    document.getElementById('grupo-bid').style.display =
      document.getElementById('p-bid').checked ? 'block' : 'none';
  }

  // ─── Especialidades ────────────────────────────────────────────────────────
  async function loadEspecialidades() {
    try {
      const data = await api.get('/especialidades');
      const items = Array.isArray(data) ? data : [];
      const sel = document.getElementById('p-especialidade');
      items.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = e.nome;
        sel.appendChild(opt);
      });
    } catch { /* silent */ }
  }

  // ─── Plantões ──────────────────────────────────────────────────────────────
  async function loadPlantoes() {
    const tbody = document.getElementById('plantoes-tbody');
    tbody.innerHTML = '<tr><td colspan="8"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>';
    const status = document.getElementById('filter-status').value;
    const qs = status ? `?status=${status}` : '';
    try {
      const data = await api.get(`/plantoes/hospital${qs}`);
      const items = Array.isArray(data) ? data : (data.plantoes || []);
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-title">Nenhum plantão</div><div class="empty-state-text">Clique em "Novo Plantão" para criar.</div></div></td></tr>';
        return;
      }
      tbody.innerHTML = items.map(p => `
        <tr>
          <td class="td-secondary">#${p.id}</td>
          <td>${p.especialidade?.nome || p.especialidadeNome || '—'}</td>
          <td>${fmtDate(p.dataInicio)}</td>
          <td>${fmtDuracao(p.dataInicio, p.dataFim)}</td>
          <td>${fmtMoney(p.valorBase, p.tipoValor)}</td>
          <td>${statusBadge(p.status)}</td>
          <td>${p._count?.candidaturas ?? p.totalCandidatos ?? 0}</td>
          <td>
            <div class="td-actions">
              <button class="btn btn-ghost btn-xs" onclick="abrirChat(${p.id}, '${(p.titulo||'Plantão #'+p.id).replace(/'/g,"\\'")}', '${fmtDate(p.dataInicio)}')">💬 Chat</button>
              <a href="candidaturas.html?plantao=${p.id}" class="btn btn-ghost btn-xs">Candidatos</a>
              ${p.status === 'ABERTO' ? `<button class="btn btn-danger btn-xs" onclick="cancelarPlantao(${p.id})">Cancelar</button>` : ''}
            </div>
          </td>
        </tr>
      `).join('');
    } catch {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-secondary);padding:32px;">Erro ao carregar plantões.</td></tr>';
    }
  }

  async function cancelarPlantao(id) {
    const ok = await showConfirm('Deseja cancelar este plantão?');
    if (!ok) return;
    try {
      await api.post(`/plantoes/${id}/cancelar`);
      toast.success('Plantão cancelado.');
      loadPlantoes();
    } catch (err) { toast.error(err.message); }
  }
  window.cancelarPlantao = cancelarPlantao;

  // ─── Modal Novo Plantão ────────────────────────────────────────────────────
  function fecharModalPlantao() {
    document.getElementById('modal-plantao').style.display = 'none';
  }
  window.fecharModalPlantao = fecharModalPlantao;

  document.getElementById('btn-novo-plantao').addEventListener('click', () => {
    document.getElementById('modal-plantao').style.display = 'flex';
  });
  document.getElementById('modal-plantao').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-plantao')) fecharModalPlantao();
  });

  document.getElementById('btn-salvar-plantao').addEventListener('click', async () => {
    const titulo    = document.getElementById('p-titulo').value.trim();
    const espId     = document.getElementById('p-especialidade').value;
    const inicio    = document.getElementById('p-data-inicio').value;
    const fim       = document.getElementById('p-data-fim').value;
    const valor     = document.getElementById('p-valor').value;
    const tipoValor = document.getElementById('p-tipo-valor').value;
    const rqe       = document.getElementById('p-rqe').checked;
    const bid       = document.getElementById('p-bid').checked;
    const urgente   = document.getElementById('p-urgente').checked;
    const valMinBid = document.getElementById('p-valor-min-bid').value;
    const obs       = document.getElementById('p-obs').value.trim();
    const localCep  = document.getElementById('p-local-cep').value.trim();
    const localNome = document.getElementById('p-local-nome').value.trim();
    const localCid  = document.getElementById('p-local-cidade').value.trim();
    const localUf   = document.getElementById('p-local-uf').value.trim().toUpperCase();

    if (!titulo || !espId || !inicio || !fim || !valor || !localNome || !localCid || !localUf) {
      toast.error('Preencha todos os campos obrigatórios.');
      return;
    }
    if (new Date(fim) <= new Date(inicio)) {
      toast.error('A data de fim deve ser após o início.');
      return;
    }

    const btn = document.getElementById('btn-salvar-plantao');
    btn.classList.add('btn-loading'); btn.disabled = true;

    try {
      await api.post('/plantoes', {
        titulo,
        especialidadeId: Number(espId),
        dataInicio: new Date(inicio).toISOString(),
        dataFim:    new Date(fim).toISOString(),
        valorBase:  Number(valor),
        tipoValor,
        exigeRQE:   rqe,
        permiteBid: bid,
        urgente,
        valorMinimoBid: bid && valMinBid ? Number(valMinBid) : undefined,
        localCep: localCep || undefined,
        localNome,
        localCidade: localCid,
        localUf,
        descricao: obs || undefined,
      });
      toast.success('Plantão publicado com sucesso!');
      fecharModalPlantao();
      document.getElementById('form-plantao').reset();
      setTipoValor('FIXO');
      document.getElementById('grupo-bid').style.display = 'none';
      document.getElementById('duracao-preview').style.display = 'none';
      loadPlantoes();
    } catch (err) {
      toast.error(err.message || 'Erro ao criar plantão');
    } finally {
      btn.classList.remove('btn-loading'); btn.disabled = false;
    }
  });

  // ─── Chat ──────────────────────────────────────────────────────────────────
  function abrirChat(plantaoId, titulo, data) {
    _chatPlantaoId = plantaoId;
    document.getElementById('chat-titulo').textContent = titulo;
    document.getElementById('chat-subtitulo').textContent = data;
    document.getElementById('chat-overlay').style.display = 'flex';
    carregarMensagensChat();
  }
  window.abrirChat = abrirChat;

  function fecharChat() {
    document.getElementById('chat-overlay').style.display = 'none';
    _chatPlantaoId = null;
  }
  window.fecharChat = fecharChat;

  document.getElementById('chat-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('chat-overlay')) fecharChat();
  });

  function fmtChatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  async function carregarMensagensChat() {
    if (!_chatPlantaoId) return;
    try {
      const data = await api.get(`/chat/plantao/${_chatPlantaoId}`);
      const msgs = Array.isArray(data) ? data : [];
      const container = document.getElementById('chat-messages');
      if (!msgs.length) {
        container.innerHTML = '<div class="chat-empty"><span style="font-size:32px;">💬</span><span>Nenhuma mensagem ainda</span></div>';
        return;
      }
      container.innerHTML = msgs.map(m => {
        const mine = m.autor.id === _meUserId;
        return `
          <div class="chat-bubble ${mine ? 'mine' : 'other'}">
            ${!mine ? `<div class="author">${m.autor.nomeCompleto}</div>` : ''}
            ${m.texto}
            <div class="time">${fmtChatTime(m.criadoEm)}</div>
          </div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    } catch {
      document.getElementById('chat-messages').innerHTML = '<div class="chat-empty">Erro ao carregar mensagens.</div>';
    }
  }

  async function enviarMensagemChat() {
    const input = document.getElementById('chat-input');
    const texto = input.value.trim();
    if (!texto || !_chatPlantaoId) return;
    input.value = '';
    try {
      await api.post(`/chat/plantao/${_chatPlantaoId}`, { texto });
      await carregarMensagensChat();
    } catch (err) {
      toast.error('Erro ao enviar mensagem');
      input.value = texto;
    }
  }
  window.enviarMensagemChat = enviarMensagemChat;

  // ─── Init ──────────────────────────────────────────────────────────────────
  document.getElementById('filter-status').addEventListener('change', loadPlantoes);

  loadEspecialidades();
  loadPlantoes();
  </script>
</body>
</html>
